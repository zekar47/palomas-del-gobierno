{{define "content"}}
<section class="card form narrow">
  <h2>// ALISTAMIENTO</h2>
  <p class="dim">crea tu cuenta para comentar, votar y participar del foro.</p>
  {{if .Error}}<div class="flash error">{{.Error}}</div>{{end}}
  <form method="post" action="/register">
    <p><label for="username">usuario:</label>
    <input type="text" id="username" name="username" minlength="3" maxlength="24" required></p>
    <p><label for="password">contraseña:</label>
    <input type="password" id="password" name="password" minlength="6" required></p>
    <p><button type="submit">ALISTARME</button></p>
  </form>
  <p class="dim">¿ya estás alistado? <a href="/login">ingresa</a>.</p>
</section>
{{end}}
