name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # security-events solo aquí: lo exige subir el SARIF de gosec.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet + gofmt
        run: |
          go vet ./...
          [[ -z "$(gofmt -l . | grep -v '^vendor/')" ]] || (echo "archivos sin formatear"; gofmt -l . | grep -v '^vendor/'; exit 1)

      - name: Tests + gate de cobertura (>=80%)
        run: ./scripts/check_coverage.sh

      - name: Subir reporte HTML de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-html
          path: coverage.html

      - name: Compilar binario linux/amd64
        run: GOOS=linux GOARCH=amd64 go build -o palomas-linux-amd64 .

      - name: gosec (SARIF)
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: -no-fail -fmt sarif -out gosec.sarif ./...

      - name: Subir SARIF a Code Scanning
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: gosec.sarif

      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: 'false'
          check-latest: false

      - name: Subir coverage.out (formato gocover, lo lee SonarCloud)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-out
          path: coverage.out

  sonar:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Detectar SONAR_TOKEN
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Sin SONAR_TOKEN: se omite SonarCloud (paso manual pendiente)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
        if: steps.sonar.outputs.present == 'true'

      - name: Descargar coverage.out
        if: steps.sonar.outputs.present == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-out

      - name: Análisis SonarCloud
        if: steps.sonar.outputs.present == 'true'
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Reporte de métricas
        if: steps.sonar.outputs.present == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: zekar47_palomas-del-gobierno
        run: |
          ./scripts/sonar_metrics.sh
          cat docs/metrics/calidad.md >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte de métricas
        if: steps.sonar.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metricas-calidad
          path: docs/metrics/calidad.md
